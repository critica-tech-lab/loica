# Complete supervisor config, replacing Debian's.
#
# Three processes: nginx merging the ports, the web server, the Yjs WS server.
#
# This is the main config rather than a snippet under conf.d, because the stock
# one writes its own log to /var/log/supervisor and its pidfile and socket to
# /var/run. All three are read-only here, and supervisord dies on the first one
# before it starts anything.

[supervisord]
nodaemon=true
; nodaemon already echoes supervisor's own log to stdout. Pointing logfile
; there too prints every line twice, so it goes nowhere.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
# Per-process output is redirected below, so nothing needs a spool directory.
childlogdir=/tmp

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

# The stop settings on loica-ws are the data-safety part of this package, not
# boilerplate. On SIGTERM the WS server flushes every open Yjs document to
# SQLite and force-exits itself after 5 s (ws-server.ts). Cloudron restarts the
# container on every update and around backups. If supervisor killed the process
# group before that flush completed, unsaved edits would be lost on every
# update — silently.

[program:loica-web]
directory=/app/code
command=/usr/sbin/gosu node:node node node_modules/.bin/react-router-serve ./build/server/index.js
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:loica-ws]
directory=/app/code
command=/usr/sbin/gosu node:node node ws-server.ts
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=15
; Signal the process itself, not its group: the flush above runs in the node
; process and needs those seconds to finish.
killasgroup=false
stopasgroup=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startsecs=5
; nginx handles SIGTERM correctly on its own and manages its own workers.
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
