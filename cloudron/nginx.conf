# Complete nginx config, replacing Debian's.
#
# Cloudron allows an app one HTTP port. Loica listens on two — the web server
# and the Yjs WebSocket server — so nginx merges them behind :8000. It is the
# same split docs/deployment.md documents for a Caddy or nginx deploy.
#
# This replaces /etc/nginx/nginx.conf outright rather than dropping a vhost
# beside it, because the stock config writes logs under /var/log/nginx and
# temp files under /var/lib/nginx. Both are read-only here, and `error_log` is
# a top-level directive that a vhost cannot override.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Everything nginx writes goes to /run — the root filesystem is read-only
    # and only /tmp, /run and /app/data are not.
    client_body_temp_path /run/nginx/body;
    proxy_temp_path       /run/nginx/proxy;
    fastcgi_temp_path     /run/nginx/fastcgi;
    scgi_temp_path        /run/nginx/scgi;
    uwsgi_temp_path       /run/nginx/uwsgi;

    # The platform's nginx terminates TLS in front of this one, so responses
    # are already compressed on the way out; nothing to gain by doing it twice.
    gzip off;

    server {
        listen 8000;

        # api.upload.ts rejects anything over 20 MB itself. Leave headroom so
        # the app answers with its own error rather than nginx returning a
        # bare 413.
        client_max_body_size 32m;

        # The platform's nginx already sends the upgrade headers; this second
        # hop has to pass them along. Origin survives both hops, which is what
        # ws-server.ts checks against ALLOWED_ORIGINS.
        location /ws {
            proxy_pass http://127.0.0.1:4001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # A collaborator can sit on an open document all day without
            # sending anything; the WS server's own heartbeat decides when a
            # peer is gone.
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
